[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The launch compares the deployed bytes without the metadata hash; a build with the default hash
# is refused as not reproducible.
bytecode_hash = "none"
verbosity = 2

[fuzz]
runs = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
